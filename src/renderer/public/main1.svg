<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a10" />
    </radialGradient>

    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#00a8ff" />
      <stop offset="100%" stop-color="#0052cc" />
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" stroke="#1f293d" stroke-width="4"/>

  <circle cx="256" cy="256" r="180" fill="none" stroke="#111e30" stroke-width="2" stroke-dasharray="4 8" />
  <circle cx="256" cy="256" r="120" fill="none" stroke="#111e30" stroke-width="1" />
  <line x1="256" y1="50" x2="256" y2="462" stroke="#111e30" stroke-width="1" stroke-dasharray="2 4" />
  <line x1="50" y1="256" x2="462" y2="256" stroke="#111e30" stroke-width="1" stroke-dasharray="2 4" />

  <polygon points="256,90 396,170 396,342 256,422 116,342 116,170" 
           fill="none" stroke="#162235" stroke-width="6" />

  <polygon points="256,110 378,180 378,332 256,402 134,332 134,180" 
           fill="none" stroke="url(#cyanNeon)" stroke-width="4" filter="url(#neonGlow)" stroke-dasharray="140 40 80 30" />

  <g filter="url(#neonGlow)">
    <circle cx="256" cy="256" r="32" fill="#00f0ff" />
    
    <path d="M 210,220 A 60,60 0 0,1 302,220" fill="none" stroke="url(#cyanNeon)" stroke-width="6" stroke-linecap="round" />
    <path d="M 302,292 A 60,60 0 0,1 210,292" fill="none" stroke="url(#cyanNeon)" stroke-width="6" stroke-linecap="round" />
    
    <polyline points="256,110 256,160" fill="none" stroke="#00f0ff" stroke-width="3" stroke-linecap="round" />
    <polyline points="134,332 184,302" fill="none" stroke="#00f0ff" stroke-width="3" stroke-linecap="round" />
    <polyline points="378,332 328,302" fill="none" stroke="#00f0ff" stroke-width="3" stroke-linecap="round" />
  </g>

  <rect x="246" y="24" width="20" height="4" fill="#00f0ff" opacity="0.7"/>
</svg>
